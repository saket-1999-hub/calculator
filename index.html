<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
    <title>Calculator</title>
  </head>
  <body>
    <div class="calc-outer">
      <div class="display"></div>

      <div class="row-1">
        <button class="btn clear-btn">Ac</button>
        <button class="btn delete-btn">Del</button>
      </div>

      <div class="row-2">
        <button class="btn num-btn">7</button>
        <button class="btn num-btn">8</button>
        <button class="btn num-btn">9</button>
        <button class="btn divide-btn operation">÷</button>
      </div>

      <div class="row-3">
        <button class="btn num-btn">4</button>
        <button class="btn num-btn">5</button>
        <button class="btn num-btn">6</button>
        <button class="btn multiply-btn operation">×</button>
      </div>

      <div class="row-4">
        <button class="btn num-btn">1</button>
        <button class="btn num-btn">2</button>
        <button class="btn num-btn">3</button>
        <button class="btn minus-btn operation">-</button>
      </div>

      <div class="row-5">
        <button class="btn dot-btn">.</button>
        <button class="btn num-btn">0</button>
        <button class="btn eual-btn">=</button>
        <button class="btn plus-btn operation">+</button>
      </div>
    </div>
  </body>
</html>
